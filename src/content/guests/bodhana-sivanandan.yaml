bio:
  en: |
    One of the most remarkable young talents in chess. Bodhana was born in London in 2015 and started playing during the 2020 lockdown. In 2022 she won all 24 games at the European Schools Championships, and in 2024 she was the world's number one girl under 10. That summer, aged nine, she was picked for the England women's team at the Olympiad in Budapest, the youngest person ever selected for a full England team in any sport.

    In August 2025 she beat grandmaster Peter Wells at the British Championship, the youngest girl ever to beat a grandmaster, and earned the Woman International Master title. In 2026 she became a FIDE Master, England's top-rated woman with a rating above 2400, and at 11 the youngest ever British Women's Champion.

    At the 2026 Olympiad in Samarkand she played top board for England and completed the norms for the Woman Grandmaster title. In October she made her third International Master norm at 11 years, 7 months and 16 days, breaking Judit Polgár's 1988 record as the youngest woman to meet the requirements for the IM title. FIDE's confirmation of both titles is pending.
  fi: |
    Yksi shakin merkittävimmistä nuorista kyvyistä. Bodhana syntyi Lontoossa vuonna 2015 ja aloitti pelaamisen vuoden 2020 koronasulun aikana. Vuonna 2022 hän voitti kaikki 24 peliään Euroopan koulujen mestaruuskilpailuissa, ja vuonna 2024 hän oli alle 10-vuotiaiden tyttöjen maailmanlistan ykkönen. Samana kesänä, yhdeksänvuotiaana, hänet valittiin Englannin naisjoukkueeseen Budapestin olympialaisiin, nuorimpana koskaan Englannin aikuisten maajoukkueeseen valittuna urheilijana missään lajissa.

    Elokuussa 2025 hän voitti Britannian mestaruuskilpailuissa suurmestari Peter Wellsin ja oli nuorin tyttö, joka on koskaan voittanut suurmestarin. Samalla hän sai naisten kansainvälisen mestarin (NKvM) arvonimen. Vuonna 2026 hänestä tuli FIDE-mestari (FM) ja Englannin korkeimmin luokiteltu nainen, ja hänen vahvuuslukunsa on noussut yli 2400:n. Samana vuonna hänestä tuli 11-vuotiaana nuorin koskaan Britannian naisten mestari.

    Samarkandin olympialaisissa 2026 hän pelasi Englannin ykköspöydässä ja täytti naisten suurmestarin arvonimen normit. Lokakuussa hän teki kolmannen kansainvälisen mestarin (KvM) normin 11 vuoden, 7 kuukauden ja 16 päivän ikäisenä ja rikkoi Judit Polgárin vuodelta 1988 olevan ennätyksen: hän on nuorin nainen, joka on täyttänyt KvM-arvonimen vaatimukset. FIDEn vahvistusta uusille arvonimille odotetaan.
