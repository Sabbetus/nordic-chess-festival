bio:
  en: |
    Lithuanian grandmaster since 1996 and eight-time national champion: Šarūnas won the Lithuanian Championship in 1991, 1994, 2001, 2007, 2009, 2011, 2014 and 2015. He took up chess at eight, trained at the chess academy run by Mikhail Botvinnik and Garry Kasparov from 1986 to 1989, and became an International Master in 1994.

    He has played for Lithuania at ten Chess Olympiads between 1994 and 2018, with his best result in Tromsø in 2014, where he scored 7/10 on board two, and at several European Team Championships. His tournament wins include Kolkata 2002, the Guernsey International Chess Festival in 2011 and a shared first place at Hastings in 2019.

    He also has a Finnish connection: he has played club chess in Finland since 2009 and won the Finnish league four times (2013, 2014, 2018 and 2019) with Porvoo's Velhot and later Helsinki's Come On. He writes for New in Chess and Chess Informant, and coached the Scottish team at the 2012 Olympiad.
  fi: |
    Liettualainen suurmestari vuodesta 1996 ja kahdeksankertainen kansallinen mestari: Šarūnas voitti Liettuan mestaruuden vuosina 1991, 1994, 2001, 2007, 2009, 2011, 2014 ja 2015. Hän aloitti shakin kahdeksanvuotiaana, harjoitteli vuosina 1986–1989 Mihail Botvinnikin ja Garri Kasparovin johtamassa shakkiakatemiassa ja sai kansainvälisen mestarin arvon vuonna 1994.

    Hän on pelannut Liettuan joukkueessa kymmenissä shakkiolympialaisissa vuosina 1994–2018, parhaiten Tromssassa 2014, jossa hän teki toisella laudalla 7/10, sekä useissa joukkue-EM-kilpailuissa. Hänen turnausvoittojensa joukossa ovat Kolkata 2002, Guernseyn kansainvälinen shakkifestivaali 2011 ja jaettu ensimmäinen sija Hastingsissa 2019.

    Hänellä on myös Suomi-yhteys: hän on pelannut seurashakkia Suomessa vuodesta 2009 ja voittanut SM-liigan neljä kertaa (2013, 2014, 2018 ja 2019) Porvoon Velhoissa ja myöhemmin Helsingin Come Onissa. Hän kirjoittaa New in Chess- ja Chess Informant -lehtiin ja valmensi Skotlannin joukkuetta Istanbulin olympialaisissa 2012.
