bio:
  en: |
    Lithuanian grandmaster since 1996. Šarūnas won the Lithuanian Championship in 1991, 1994, 1998 (shared), 2007 and 2009, played for Lithuania at seven Chess Olympiads and won the Guernsey International Chess Festival in 2011.
  fi: |
    Liettualainen suurmestari vuodesta 1996. Šarūnas voitti Liettuan mestaruuden vuosina 1991, 1994, 1998 (jaettu), 2007 ja 2009, pelasi Liettuan joukkueessa seitsemissä shakkiolympialaisissa ja voitti Guernseyn kansainvälisen shakkifestivaalin vuonna 2011.
