bio:
  en: |
    Known online as AlexandraChess, Alexandra is a Woman Candidate Master from Bolivia and was one of the best junior players in her country. As a junior she represented Bolivia at the Olympiad and at the World Championship.

    She began streaming in Spanish on a national Bolivian channel during the pandemic, then switched to English and became known for beginner-friendly traps and tricks, often shown on a real board. Her first video of this kind reportedly passed a million views, and she now has hundreds of thousands of followers across YouTube, Twitch and other platforms.
  fi: |
    Verkossa AlexandraChess-nimellä tunnettu Alexandra on bolivialainen naisten ehdokasmestari ja yksi maansa parhaista junioripelaajista. Junioreena hän edusti Boliviaa olympialaisissa ja maailmanmestaruuskilpailuissa.

    Hän aloitti suoratoiston espanjaksi bolivialaisella kansallisella kanavalla pandemian aikana, siirtyi sitten englantiin ja tuli tunnetuksi aloittelijaystävällisistä ansoista ja vinkeistä, joita hän esittelee usein oikealla laudalla. Hänen ensimmäinen tällainen videonsa ylitti kuulemma miljoona katselukertaa, ja nykyään hänellä on satoja tuhansia seuraajia YouTubessa, Twitchissä ja muilla alustoilla.
