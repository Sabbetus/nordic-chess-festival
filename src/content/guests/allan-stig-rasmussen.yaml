bio:
  en: |
    Danish grandmaster from Aarhus, born in 1983. He earned his grandmaster norms at the Politiken Cup in 2006, in Mariánské Lázně in 2008 and in the Danish league in 2008–09, and became a grandmaster in 2009. He is a four-time national champion, winning the Danish Championship in 2010, 2011, 2014 and 2019.

    He holds the record for most Danish Blitz Championship titles, six (2006, 2012, 2016, 2017, 2018 and 2019), and played for Denmark at four Chess Olympiads, in 2008, 2010, 2012 and 2014. At club level he plays for Jetsmark Skakklub, with which he has won several Danish team championships.

    Away from the board he is a trained teacher and deputy head of Tjele Efterskole, where he has taught maths, sports and chess.
  fi: |
    Tanskalainen suurmestari Aarhusista, syntynyt vuonna 1983. Hän saavutti suurmestarinormit Politiken Cupissa 2006, Mariánské Lázněssa 2008 ja Tanskan sarjassa kaudella 2008–2009 ja sai suurmestarin arvon vuonna 2009. Hän on nelinkertainen kansallinen mestari: hän voitti Tanskan mestaruuden vuosina 2010, 2011, 2014 ja 2019.

    Hänellä on ennätys Tanskan pikashakin mestaruuksien määrässä, kuusi (2006, 2012, 2016, 2017, 2018 ja 2019), ja hän pelasi Tanskan joukkueessa neljissä shakkiolympialaisissa vuosina 2008, 2010, 2012 ja 2014. Seurajoukkueessa hän pelaa Jetsmark Skakklubissa, jonka kanssa hän on voittanut useita Tanskan joukkuemestaruuksia.

    Shakin ulkopuolella hän on koulutettu opettaja ja Tjele Efterskolen apulaisrehtori, jossa hän on opettanut matematiikkaa, liikuntaa ja shakkia.
