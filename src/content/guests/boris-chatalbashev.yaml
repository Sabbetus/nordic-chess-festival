bio:
  en: |
    Born in Pleven, Bulgaria, Boris became the youngest Bulgarian champion in history in 1991, and won the national title again in 1998, 2007 and 2010. A grandmaster since 1997, he has played for Denmark since 2018 and won the Danish Championship in 2023 and 2024.
  fi: |
    Pleven, Bulgarian syntynyt Boris voitti Bulgarian mestaruuden vuonna 1991 maan historian nuorimpana mestarina ja uudelleen vuosina 1998, 2007 ja 2010. Suurmestari vuodesta 1997, hän on edustanut Tanskaa vuodesta 2018 ja voittanut Tanskan mestaruuden vuosina 2023 ja 2024.
