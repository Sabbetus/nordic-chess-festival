bio:
  en: |
    Born in Pleven, Bulgaria, Boris became the youngest Bulgarian champion in history in 1991, and won the national title again in 1998, 2007 and 2010. A grandmaster since 1997, he has played for Denmark since 2018 and won the Danish Championship in 2023 and 2024.

    A trained economist, he is a prolific tournament winner, especially in French and Italian opens: his many first places include Chambéry (1996), Paris (1997), Lyon (2001), Genoa (2005) and Rijeka (2007), and he was third at Hastings in 2008. He took silver at the Bulgarian Championship in 2004 and 2009 and played for Bulgaria at the Olympiads of 1996, 1998 and 2004.

    In December 2021 he also won 20,000 leva on the Bulgarian edition of Who Wants to Be a Millionaire.
  fi: |
    Plevenissä, Bulgariassa syntynyt Boris voitti Bulgarian mestaruuden vuonna 1991 maan historian nuorimpana mestarina ja uudelleen vuosina 1998, 2007 ja 2010. Hän on suurmestari vuodesta 1997 ja on edustanut Tanskaa vuodesta 2018. Tanskan mestaruuden hän voitti vuosina 2023 ja 2024.

    Koulutukseltaan ekonomi Boris on ahkera turnausvoittaja, erityisesti Ranskan ja Italian avoimissa turnauksissa: hänen lukuisia ensimmäisiä sijojaan ovat muun muassa Chambéry (1996), Pariisi (1997), Lyon (2001), Genova (2005) ja Rijeka (2007), ja Hastingsissa 2008 hän oli kolmas. Hän on voittanut hopeaa Bulgarian mestaruuskilpailuissa vuosina 2004 ja 2009 ja pelannut Bulgarian joukkueessa olympialaisissa 1996, 1998 ja 2004.

    Joulukuussa 2021 hän voitti lisäksi 20 000 leviä Bulgarian Haluatko miljonääriksi? -tietokilpailussa.
