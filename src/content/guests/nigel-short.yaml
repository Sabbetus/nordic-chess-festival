bio:
  en: |
    One of the great names of English chess. Short learned the game at five, was the only player to beat Viktor Korchnoi in a 31-board simul at the age of ten, and in 1977 became the youngest ever competitor at the British Championship. He broke Bobby Fischer's record as the youngest International Master in 1979/80 and became a grandmaster in 1984.

    Short rose to third in the world, came through the Candidates cycle by beating Anatoly Karpov in the semifinal and Jan Timman in the final, and challenged Garry Kasparov for the World Championship in London in 1993, the first Englishman to contest a world title match. He played for England at 17 consecutive Chess Olympiads, won three team silver medals and has won the British Championship three times.

    Today he is FIDE Director for Chess Development, and a well-known commentator and columnist. He was appointed MBE in 1999 for services to chess.
  fi: |
    Yksi Englannin shakin suurista nimistä. Short oppi pelin viisivuotiaana, oli kymmenvuotiaana ainoa pelaaja, joka voitti Viktor Kortšnoin 31 laudan simultaanissa, ja vuonna 1977 hänestä tuli Britannian mestaruuskilpailujen nuorin osallistuja koskaan. Hän rikkoi Bobby Fischerin ennätyksen nuorimpana kansainvälisenä mestarina vuonna 1979/80 ja sai suurmestarin arvon vuonna 1984.

    Short nousi maailmanlistan kolmanneksi, voitti ehdokasturnauksen kukistamalla Anatoli Karpovin välierässä ja Jan Timmanin finaalissa ja haastoi Garri Kasparovin maailmanmestaruusottelussa Lontoossa vuonna 1993, ensimmäisenä englantilaisena. Hän pelasi Englannin joukkueessa 17 peräkkäisissä shakkiolympialaisissa, voitti kolme joukkuehopeaa ja on voittanut Britannian mestaruuden kolme kertaa.

    Nykyään hän on FIDEn shakin kehitysjohtaja sekä tunnettu kommentaattori ja kolumnisti. Hänet nimitettiin MBE-kunniamerkin saajaksi vuonna 1999 ansioistaan shakille.
