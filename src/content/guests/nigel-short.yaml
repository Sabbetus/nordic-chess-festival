bio:
  en: |
    One of the great names of English chess. Short became a grandmaster in 1984, rose to world number three and won the Candidates cycle to challenge Garry Kasparov for the World Championship in 1993.

    Today he is FIDE Director for Chess Development, and a well-known commentator and columnist.
  fi: |
    Yksi Englannin shakin suurista nimistä. Short sai suurmestarin arvon vuonna 1984, nousi maailmanlistan kolmanneksi ja voitti ehdokasturnauskierroksen, minkä jälkeen hän haastoi Garri Kasparovin maailmanmestaruudesta vuonna 1993.

    Nykyään hän toimii FIDEn shakin kehitysjohtajana sekä tunnettuna kommentaattorina ja kolumnistina.
