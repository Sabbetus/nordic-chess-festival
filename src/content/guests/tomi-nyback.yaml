bio:
  en: |
    In a league of his own among Finnish players, Tomi became Finland's youngest ever grandmaster in 2003 at the age of 18 and won the Finnish Championship in 2008 with a perfect 9/9. In January 2007 he became the first Finn to pass a 2600 rating.

    A gifted junior, he won bronze at the 2002 European Under-18 Championship and the 2003 World Youth Championship. He has played for Finland at seven Chess Olympiads, on top board in 2004 and 2006, and at the 2008 Olympiad in Dresden he beat Magnus Carlsen, then rated 2786. He also won individual bronze on top board at the 2005 European Team Championship, and played for Werder Bremen in the German Bundesliga, celebrating the 2005 title with the club.

    In 2008 he tied for second at the European Individual Championship, qualifying for the 2009 World Cup, and in April 2009 he stood 73rd in the world. Around 2009 he began to play more poker than chess, and he has also worked as a game programmer.
  fi: |
    Tomi on omassa luokassaan suomalaisten pelaajien joukossa. Hänestä tuli Suomen nuorin suurmestari vuonna 2003 18-vuotiaana, hän voitti Suomen mestaruuden vuonna 2008 täydellä 9/9-tuloksella ja oli tammikuussa 2007 ensimmäinen suomalainen, jonka vahvuusluku ylitti 2600.

    Lupaava juniori voitti pronssia Euroopan alle 18-vuotiaiden mestaruuskilpailuissa 2002 ja nuorten maailmanmestaruuskilpailuissa 2003. Hän on pelannut Suomen joukkueessa seitsemissä shakkiolympialaisissa, vuosina 2004 ja 2006 ykköslaudalla, ja Dresdenin olympialaisissa 2008 hän voitti Magnus Carlsenin, jonka vahvuusluku oli tuolloin 2786. Lisäksi hän voitti yksilöpronssia ykköslaudalla joukkue-EM-kilpailuissa 2005 ja pelasi Saksan Bundesliigassa Werder Bremenissä, jonka kanssa hän juhli mestaruutta 2005.

    Vuonna 2008 hän jakoi toisen sijan Euroopan mestaruuskilpailuissa ja pääsi vuoden 2009 maailmancupiin, ja huhtikuussa 2009 hän oli maailmanlistan 73. Noin vuonna 2009 hän alkoi pelata pokeria shakkia enemmän, ja hän on työskennellyt myös pelien ohjelmoijana.
