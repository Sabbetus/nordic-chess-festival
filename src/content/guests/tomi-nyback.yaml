bio:
  en: |
    In a league of his own among Finnish players, Tomi became Finland's youngest ever grandmaster in 2003 at the age of 18, won the Finnish Championship in 2008 with a perfect 9/9 and played for Finland at seven Chess Olympiads.
  fi: |
    Tomi on omassa sarjassaan suomalaisten pelaajien joukossa. Hänestä tuli Suomen nuorin suurmestari vuonna 2003 18-vuotiaana, hän voitti Suomen mestaruuden vuonna 2008 täydellä 9/9-tuloksella ja pelasi Suomen joukkueessa seitsemissä shakkiolympialaisissa.
