bio:
  en: |
    Finland's youngest ever grandmaster, who earned the title in 2003 at the age of 18. Tomi won the Finnish Championship in 2008 with a perfect 9/9 and played for Finland at seven Chess Olympiads.
  fi: |
    Suomen nuorin suurmestari, joka sai arvon vuonna 2003 18-vuotiaana. Tomi voitti Suomen mestaruuden vuonna 2008 täydellä 9/9-tuloksella ja pelasi Suomen joukkueessa seitsemissä shakkiolympialaisissa.
