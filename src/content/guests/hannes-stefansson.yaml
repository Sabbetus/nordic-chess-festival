bio:
  en: |
    Iceland's most successful champion, with a record thirteen national titles. Hannes won the World Under-16 Championship in 1987 and became a grandmaster in 1993.
  fi: |
    Islannin menestynein mestari, jolla on ennätykselliset 13 kansallista mestaruutta. Hannes voitti alle 16-vuotiaiden maailmanmestaruuden vuonna 1987 ja sai suurmestarin arvon vuonna 1993.
