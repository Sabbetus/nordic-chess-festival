bio:
  en: |
    Iceland's most successful champion, with a record thirteen national titles: 1998, 1999, every year from 2001 to 2008, and 2010, 2013 and 2019. Hannes won the World Under-16 Championship in 1987, made his debut in the Icelandic Championship at 14 in 1986 and became a grandmaster in 1993.

    He has played for Iceland at 14 Chess Olympiads since 1992, ten of them on board one. His tournament wins include Athens 1993, Kópavogur 1994, the Friðrik Memorial in 1995, the Politiken Cup in 1998 and Open Teplice in 2015.

    He is a fixture at the Reykjavik Open, which he won outright in 2000 and shared first place in 1994, 2008, 2009 and 2010. At his best he ranked 83rd in the world, in January 2002.
  fi: |
    Islannin menestynein mestari, jolla on ennätykselliset 13 kansallista mestaruutta: 1998, 1999, jokainen vuosi 2001–2008 sekä 2010, 2013 ja 2019. Hannes voitti alle 16-vuotiaiden maailmanmestaruuden vuonna 1987, pelasi ensimmäisen kerran Islannin mestaruuskilpailuissa 14-vuotiaana vuonna 1986 ja sai suurmestarin arvon vuonna 1993.

    Hän on pelannut Islannin joukkueessa 14 shakkiolympialaisissa vuodesta 1992 alkaen, kymmenessä niistä ykköslaudalla. Hänen turnausvoittojensa joukossa ovat Ateena 1993, Kópavogur 1994, Friðrik-muistoturnaus 1995, Politiken Cup 1998 ja Open Teplice 2015.

    Hän on vakiovieras Reykjavik Openissa, jonka hän voitti yksin vuonna 2000 ja jonka ensimmäisen sijan hän jakoi vuosina 1994, 2008, 2009 ja 2010. Parhaimmillaan hän oli maailmanlistan 83. tammikuussa 2002.
