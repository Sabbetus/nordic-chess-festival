bio:
  en: |
    One of the biggest names in chess content, with a huge following on YouTube and Twitch. Anna is a Woman FIDE Master who has played for Sweden at the Chess Olympiad, and the daughter of grandmasters Pia Cramling and Juan Manuel Bellón López.

    She won Best Strategy Game Streamer at the 2024 Streamer Awards.
  fi: |
    Yksi shakkisisältöjen suurimmista nimistä, jolla on valtava seuraajajoukko YouTubessa ja Twitchissä. Anna on naisten FIDE-mestari, joka on pelannut Ruotsin joukkueessa shakkiolympialaisissa. Hänen vanhempansa ovat suurmestarit Pia Cramling ja Juan Manuel Bellón López.

    Hän voitti Best Strategy Game Streamer -palkinnon vuoden 2024 Streamer Awards -gaalassa.
