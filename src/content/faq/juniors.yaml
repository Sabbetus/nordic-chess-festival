order: 3
category: general
question:
  en: Can juniors play? Is there an age limit?
  fi: Voivatko juniorit osallistua? Onko ikärajaa?
answer:
  en: |-
    There is no age limit: the Main Event is open to everyone, and juniors (born 2009 or later) pay the discounted price. If the player is under 18, we recommend that a parent or guardian completes the registration and gives their own email address and phone number.
  fi: |-
    Ikärajaa ei ole: pääturnaus on avoin kaikille, ja juniorit (syntyneet 2009 tai myöhemmin) maksavat alennetun hinnan. Jos pelaaja on alle 18-vuotias, suosittelemme, että vanhempi tai huoltaja tekee rekisteröitymisen ja antaa oman sähköpostiosoitteensa ja puhelinnumeronsa.
