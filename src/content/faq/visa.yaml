order: 23
question:
  en: Do I need a visa? Can I get an invitation letter?
  fi: Tarvitsenko viisumin? Saanko kutsukirjeen?
answer:
  en: |-
    Whether you need a visa to visit Finland depends on your nationality; the official information from the Finnish Immigration Service (Migri) and the Ministry for Foreign Affairs is linked on the [Travel & stay](/travel/) page. If you need an invitation letter for your visa application, email [info@nordicchess.fi](mailto:info@nordicchess.fi).
  fi: |-
    Viisumin tarve riippuu kansalaisuudestasi; Maahanmuuttoviraston (Migri) ja ulkoministeriön viralliset tiedot on linkitetty sivulle [Matkat ja majoitus](/travel/). Jos tarvitset kutsukirjeen viisumihakemusta varten, kirjoita osoitteeseen [info@nordicchess.fi](mailto:info@nordicchess.fi).
