order: 22
question:
  en: How do I get to the venue, and is there parking?
  fi: Miten pääsen pelipaikalle, ja onko pysäköintiä?
answer:
  en: |-
    The venue is Kangasala Areena, Finnentie 37, Kangasala, about a 25-minute drive from central Tampere. There is a large parking lot at the venue, and other public lots nearby. By public transport, take a local bus from central Tampere to the Kangasala bus station, from where it is about a 20-minute walk. The festival bus goes straight to the venue. More in [Travel & stay](/travel/#getting-there).
  fi: |-
    Pelipaikka on Kangasala Areena, Finnentie 37, Kangasala, noin 25 minuutin ajomatkan päässä Tampereen keskustasta. Areenalla on iso parkkialue, ja läheisyydessä on myös muita yleisiä pysäköintialueita. Julkisilla pääset Tampereen keskustasta paikallisbussilla Kangasalan linja-autoasemalle, josta on noin 20 minuutin kävelymatka. Festivaalibussi vie suoraan pelipaikalle. Lisää sivulla [Matkat ja majoitus](/travel/#getting-there).
