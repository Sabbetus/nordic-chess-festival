order: 15
category: tournament
question:
  en: Which rules should I know about before playing?
  fi: Mitä sääntöjä minun pitäisi tietää ennen pelaamista?
answer:
  en: |-
    A few that differ from many events: electronic devices, including phones, smartwatches, headphones and your own pens, must be handed in before you enter the playing area, and breaking this rule loses the game; a draw cannot be offered or agreed before both players have made 20 moves; you may take one half-point bye in rounds 1–5 if you tell the Chief Arbiter before that round's pairings are published; and the default time is 30 minutes. Read the full [competition regulations](/main-event/#regulations).
  fi: |-
    Muutama sääntö poikkeaa monista turnauksista: elektroniset laitteet, kuten puhelimet, älykellot, kuulokkeet ja omat kynät, on luovutettava ennen pelitilaan saapumista, ja säännön rikkominen johtaa pelin häviöön; tasapeliä ei saa ehdottaa eikä sopia ennen kuin kumpikin pelaaja on tehnyt vähintään 20 siirtoa; kierroksilla 1–5 voi pitää yhden puolen pisteen vapaakierroksen, kunhan siitä ilmoittaa päätuomarille ennen kierroksen parien julkaisemista; ja myöhästymisaika on 30 minuuttia. Lue kaikki [kilpailumääräyksistä](/main-event/#regulations).
