order: 7
question:
  en: Is there transport from Tampere to the venue?
  fi: Onko Tampereelta kuljetusta pelipaikalle?
answer:
  en: Yes. An optional daily bus transfer costs 50 €, return trips included. It runs between central Tampere and Kangasala Areena (about 25 minutes each way), with pick-ups at Sokos Hotel Ilves and Sokos Hotel Torni. You can add it when you [register](/register/#register). The timetable is not published on the website. It is emailed to registered players who have bought the bus transfer. More in [Travel & stay](/travel/#getting-there).
  fi: Kyllä. Valinnainen päivittäinen bussikuljetus maksaa 50 €, ja paluumatkat kuuluvat hintaan. Bussi kulkee Tampereen keskustan ja Kangasala Areenan välillä (noin 25 minuuttia suuntaansa), ja nouto tapahtuu Sokos Hotel Ilveksestä ja Sokos Hotel Tornista. Voit lisätä sen [ilmoittautumisen](/register/#register) yhteydessä. Aikataulua ei julkaista verkkosivuilla, vaan se lähetetään sähköpostitse ilmoittautuneille pelaajille, jotka ovat ostaneet bussikuljetuksen. Lisää sivulla [Matkustus ja majoitus](/travel/#getting-there).
