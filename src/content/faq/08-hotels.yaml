order: 20
question:
  en: Where can I stay?
  fi: Missä voin yöpyä?
answer:
  en: Our partner hotels, all with special rates for festival players, are Hotel H28 in central Tampere and Hotelli Kuohu in Kangasala (the lowest rates, booked by email or phone), and Original Sokos Hotel Ilves and Solo Sokos Hotel Torni Tampere in central Tampere (booked online with a booking code). Prices and booking details are on the [Travel & stay](/travel/#stay) page.
  fi: Yhteistyöhotellimme, joissa kaikissa on festivaalin pelaajille erityishinnat, ovat Hotel H28 Tampereen keskustassa ja Hotelli Kuohu Kangasalla (edullisimmat hinnat, varaus sähköpostilla tai puhelimitse) sekä Original Sokos Hotel Ilves ja Solo Sokos Hotel Torni Tampere Tampereen keskustassa (varaus netissä varauskoodilla). Hinnat ja varausohjeet ovat sivulla [Matkat ja majoitus](/travel/#stay).
