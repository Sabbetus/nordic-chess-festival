order: 8
question:
  en: Where can I stay?
  fi: Missä voin yöpyä?
answer:
  en: Our partner hotels are Original Sokos Hotel Ilves and Solo Sokos Hotel Torni Tampere in central Tampere, with special rates for festival players. The quickest way to book is online with the booking code on the [Travel & stay](/travel/#stay) page.
  fi: Yhteistyöhotellimme ovat Original Sokos Hotel Ilves ja Solo Sokos Hotel Torni Tampere Tampereen keskustassa, ja festivaalin pelaajille on tarjolla erityishinnat. Nopein tapa varata on netissä sivulla [Matkustus ja majoitus](/travel/#stay) olevalla varauskoodilla.
