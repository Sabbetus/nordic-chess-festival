order: 18
question:
  en: Can I come to watch?
  fi: Voinko tulla katsomaan?
answer:
  en: |-
    Yes. Spectators may be in the playing area during the first 10 minutes of each round, after leaving their electronic devices at the place the organiser designates. Photographing in the playing area is allowed for the same 10 minutes, but not with a mobile phone; photographers with separate permission from the organiser are not limited to that.
  fi: |-
    Kyllä. Katsojat saavat olla pelitilassa kunkin kierroksen ensimmäisten 10 minuutin ajan, kun ovat ensin jättäneet elektroniset laitteensa järjestäjän osoittamaan paikkaan. Valokuvaaminen pelitilassa on sallittua samat 10 minuuttia, mutta ei matkapuhelimella; rajoitus ei koske järjestäjältä erillisen luvan saaneita kuvaajia.
