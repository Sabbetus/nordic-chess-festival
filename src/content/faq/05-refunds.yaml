order: 5
question:
  en: Can I get a refund if I cannot come?
  fi: Saanko rahat takaisin, jos en pääse tulemaan?
answer:
  en: If you withdraw at least 10 days before the start of the tournament, that is by 2 June 2027, we refund 75% of the entry fee. After that, entry fees are not refundable.
  fi: Jos peruutat osallistumisesi vähintään 10 päivää ennen turnauksen alkua eli 2. kesäkuuta 2027 mennessä, palautamme 75 % osallistumismaksusta. Sen jälkeen maksuja ei palauteta.
