order: 6
question:
  en: Which rating counts for the entry fee?
  fi: Mikä rating vaikuttaa osallistumismaksuun?
answer:
  en: Your FIDE rating on the day you pay your entry fee. See the [entry fee table](/register/#fees).
  fi: FIDE-ratingisi osallistumismaksun maksupäivänä. Katso [maksutaulukko](/register/#fees).
