order: 7
category: registration
question:
  en: Which rating counts for the entry fee?
  fi: Mikä vahvuusluku vaikuttaa osallistumismaksuun?
answer:
  en: Your FIDE rating on the day you pay your entry fee. See the [entry fee table](/register/#fees).
  fi: Osallistumismaksu perustuu FIDE-vahvuuslukuusi maksupäivänä. Katso [maksutaulukko](/register/#fees).
