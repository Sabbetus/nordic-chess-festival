order: 19
question:
  en: Will there be other events besides the Main Event?
  fi: Onko pääturnauksen lisäksi muuta ohjelmaa?
answer:
  en: |-
    Yes, a one-day rapid tournament is planned as a side event. Details will be announced later; see [Side events](/side-events/).
  fi: |-
    Kyllä, oheistapahtumana on suunnitteilla yhden päivän nopean shakin turnaus. Lisätiedot julkistetaan myöhemmin, katso [Oheisohjelma](/side-events/).
