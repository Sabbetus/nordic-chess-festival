order: 8
category: registration
question:
  en: I do not have a FIDE ID. Can I still register?
  fi: Minulla ei ole FIDE-tunnusta. Voinko silti rekisteröityä?
answer:
  en: You need a FIDE ID to register, also if you have no rating yet. Your national chess federation can request one for you and send it to you. The player list we check your ID against is FIDE's, and we update it on the 1st of every month, so a brand-new ID appears in it after the next update.
  fi: Rekisteröitymiseen tarvitaan FIDE-tunnus, myös silloin kun sinulla ei vielä ole vahvuuslukua. Kansallinen shakkiliittosi voi hankkia tunnuksen puolestasi ja lähettää sen sinulle. Pelaajalista, josta tunnuksesi tarkistetaan, on FIDEn lista, jonka päivitämme joka kuukauden 1. päivä, joten aivan uusi tunnus ilmestyy listalle seuraavan päivityksen jälkeen.
