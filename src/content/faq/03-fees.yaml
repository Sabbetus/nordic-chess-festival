order: 3
question:
  en: How much does it cost to play?
  fi: Paljonko osallistuminen maksaa?
answer:
  en: The entry fee depends on your FIDE rating on the day you pay, from 70 € for IMs and WIMs to 300 € for unrated players. Grandmasters and women grandmasters play for free. See the entry fees page for the full table.
  fi: Osallistumismaksu riippuu FIDE-ratingistasi maksupäivänä, IM- ja WIM-pelaajien 70 eurosta ratingittomien 300 euroon. Suurmestarit ja naissuurmestarit pelaavat ilmaiseksi. Koko taulukko on osallistumismaksusivulla.
