order: 3
question:
  en: How much does it cost to play?
  fi: Paljonko osallistuminen maksaa?
answer:
  en: The entry fee depends on your FIDE rating on the day you pay, from 70 € for IMs and WIMs to 300 € for unrated players. Grandmasters and women grandmasters play for free. See the [full table of entry fees](/register/#fees).
  fi: Osallistumismaksu riippuu FIDE-vahvuusluvustasi maksupäivänä ja on 70 eurosta (KvM ja NKvM) 300 euroon (pelaajat ilman vahvuuslukua). Suurmestarit ja naissuurmestarit pelaavat ilmaiseksi. Katso [koko maksutaulukko](/register/#fees).
