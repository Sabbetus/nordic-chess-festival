order: 16
category: tournament
question:
  en: What are the prizes and how are ties broken?
  fi: Mitä palkintoja on ja miten tasapisteet ratkaistaan?
answer:
  en: |-
    The prize fund is guaranteed to be at least 10,000 €. There are prizes for the best women player, the best junior and the best senior, and rating-class prizes, so there is something to play for at every level. Prizes are shared among players on the same score, and one player can win only one cash prize. Players on the same score are ranked by Median-Buchholz, then Buchholz – 1, Buchholz (no cut), Sonneborn-Berger and the direct encounter. See [Prizes](/prizes/).
  fi: |-
    Palkintopotti on taattu vähintään 10 000 euron suuruiseksi. Parhaalle naispelaajalle, parhaalle juniorille ja parhaalle seniorille on omat palkintonsa, ja lisäksi jaetaan vahvuusluokkapalkintoja, joten jokaisella tasolla on jotain tavoiteltavaa. Palkinnot jaetaan samassa pistemäärässä olevien kesken, ja yksi pelaaja voi voittaa vain yhden rahapalkinnon. Samassa pistemäärässä olevien pelaajien järjestys määräytyy seuraavasti: Median-Buchholz, Buchholz – 1, Buchholz (ei leikkausta), Sonneborn-Berger ja keskinäinen peli. Katso [Palkinnot](/prizes/).
