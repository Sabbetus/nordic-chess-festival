question:
  en: When and where is the festival?
  fi: Milloin ja missä festivaali järjestetään?
answer:
  en: The Nordic Chess Festival takes place in Kangasala, Finland, from 12 to 20 June 2027. The [Main Event](/main-event/) is played over nine rounds. See [Travel & stay](/travel/) for how to get there.
  fi: Nordic Chess Festival järjestetään Kangasalla 12.–20. kesäkuuta 2027. [Pääturnaus](/main-event/) pelataan yhdeksällä kierroksella. Perille pääsystä kerrotaan sivulla [Matkustus ja majoitus](/travel/).
