order: 1
question:
  en: When and where is the festival?
  fi: Milloin ja missä festivaali järjestetään?
answer:
  en: The Nordic Chess Festival takes place in Kangasala, Finland, from 12 to 20 June 2027. The Main Event is played over nine rounds.
  fi: Nordic Chess Festival järjestetään Kangasalla 12.–20. kesäkuuta 2027. Pääturnaus pelataan yhdeksällä kierroksella.
