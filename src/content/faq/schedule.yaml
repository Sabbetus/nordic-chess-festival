order: 13
question:
  en: What time are the rounds?
  fi: Mihin aikaan kierrokset pelataan?
answer:
  en: |-
    Round 1 is on Saturday 12 June at 16:00, after the opening ceremony at 15:30. Rounds 2–8 start at 14:00 (Sunday 13 June to Saturday 19 June), and round 9 on Sunday 20 June starts at 11:00, with the prize-giving at 17:00. All times are Finnish time (EEST). See the full [schedule](/main-event/#schedule).
  fi: |-
    Ensimmäinen kierros pelataan lauantaina 12. kesäkuuta klo 16:00 avajaisten (klo 15:30) jälkeen. Kierrokset 2–8 alkavat klo 14:00 (sunnuntaista 13. kesäkuuta lauantaihin 19. kesäkuuta) ja yhdeksäs kierros sunnuntaina 20. kesäkuuta klo 11:00, minkä jälkeen palkintojenjako on klo 17:00. Kaikki ajat ovat Suomen aikaa (EEST). Katso koko [aikataulu](/main-event/#schedule).
