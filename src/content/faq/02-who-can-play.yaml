question:
  en: Who can play?
  fi: Kuka voi osallistua?
answer:
  en: The Main Event is open to everyone, from grandmasters to unrated players. There is a single open section.
  fi: Pääturnaus on avoin kaikille suurmestareista ratingittomiin pelaajiin. Pääturnauksessa on yksi avoin sarja.
