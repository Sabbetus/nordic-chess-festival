question:
  en: Who can play?
  fi: Kuka voi osallistua?
answer:
  en: The Main Event is open to everyone, from grandmasters to unrated players. There is a single open section.
  fi: Main Event on avoin kaikille suurmestareista ratingittomiin pelaajiin. Main Event -turnauksessa on yksi avoin sarja.
