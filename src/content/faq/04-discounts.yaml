order: 4
question:
  en: Are there discounts?
  fi: Onko alennuksia?
answer:
  en: Yes. Anyone who pays by 31 January 2027 gets the early bird price, and juniors (born 2009 or later) and seniors (born 1962 or earlier) also pay the discounted price. Discounts do not stack, so each player gets one at most.
  fi: On. Kuka tahansa, joka maksaa 31. tammikuuta 2027 mennessä, saa early bird -hinnan, ja myös juniorit (syntyneet 2009 tai myöhemmin) ja seniorit (syntyneet 1962 tai aiemmin) maksavat alennetun hinnan. Alennukset eivät kumuloidu, joten jokainen pelaaja saa enintään yhden.
