order: 14
category: tournament
question:
  en: Do I need to confirm my participation?
  fi: Pitääkö osallistuminen varmistaa?
answer:
  en: |-
    Yes. Every player must confirm their participation on Saturday 12 June: online between 00:00 and 14:00 with the link we email you, or on site at Kangasala Areena between 12:00 and 14:00. Players who have not confirmed are not paired for round 1.
  fi: |-
    Kyllä. Jokaisen pelaajan on varmistettava osallistumisensa lauantaina 12. kesäkuuta: verkossa klo 00:00–14:00 sähköpostitse lähetettävän linkin kautta tai paikan päällä Kangasala Areenalla klo 12:00–14:00. Pelaajia, jotka eivät ole varmistaneet osallistumistaan, ei oteta mukaan 1. kierroksen paritukseen.
