# Builds the site and deploys it to Cloudflare Workers.
# Backup for Cloudflare's own Git builds: it does nothing until the two repository secrets below exist.
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  shown in the Cloudflare dashboard under Workers & Pages
name: Deploy to Cloudflare

on:
  push:
    branches: [claude/stoic-franklin-e6jw9t]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Check for Cloudflare secrets
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set, skipping deploy."

      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: npm

      # FIDE's list is big, so it is kept between runs for the whole month (see scripts/build-fide.mjs): a run downloads it
      # only when there is no cached list for the current month.
      - name: Month for the FIDE list cache
        id: month
        if: env.HAS_SECRETS == 'true'
        run: echo "month=$(TZ=Europe/Helsinki date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        if: env.HAS_SECRETS == 'true'
        with:
          path: .cache/fide
          key: fide-${{ steps.month.outputs.month }}

      - name: Install and build
        if: env.HAS_SECRETS == 'true'
        run: |
          npm ci
          npm run build
        env:
          # Test site: keep it out of search engines. Remove when the site goes live.
          PUBLIC_NOINDEX: 'true'

      - name: Deploy
        if: env.HAS_SECRETS == 'true'
        run: npx --yes wrangler@4.152.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
